<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>trevor hudson | swe</title>

        <link rel="stylesheet" href="main.css" />

        <script>
            (() => {
                var prefersDark = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                ).matches;
                document.documentElement.dataset.theme = prefersDark
                    ? "dark"
                    : "light";
            })();
        </script>
    </head>

    <body>
        <main>
            <header>
                <h1>trevor hudson</h1>
                <p>software engineer</p>
            </header>

            <nav>
                <a
                    class="row"
                    href="https://github.com/trevorhudson"
                    target="_blank"
                    rel="noopener"
                >
                    <span class="label">github</span
                    ><span class="marker">[&#8599;]</span>
                </a>
                <a
                    class="row"
                    href="https://www.linkedin.com/in/trevor-hudson-442303138/"
                    target="_blank"
                    rel="noopener"
                >
                    <span class="label">linkedin</span
                    ><span class="marker">[&#8599;]</span>
                </a>
                <button
                    class="row"
                    id="email-copy"
                    type="button"
                    data-email="trevor.c.hudson@gmail.com"
                >
                    <span class="label">email</span
                    ><span class="marker">[+]</span>
                </button>
            </nav>
        </main>

        <button
            class="row"
            id="theme-toggle"
            type="button"
            aria-label="toggle theme"
        >
            <span class="label">theme</span
            ><span class="marker">[&#8618]</span>
        </button>

        <script src="main.js"></script>
    </body>
</html>
